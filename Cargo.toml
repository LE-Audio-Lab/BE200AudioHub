[package]
name = "be200audiohub"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[[bin]]
name = "be200hub"
path = "src/main.rs"

[dependencies]
rusb = { version = "0.9", features = ["vendored"] }
bumble = { git = "https://github.com/chaitanyarahalkar/bumble-rs", rev = "bbac2a6803b8cab0920ab725a23aa408fc4fed85" }
bumble-codecs = { git = "https://github.com/chaitanyarahalkar/bumble-rs", rev = "bbac2a6803b8cab0920ab725a23aa408fc4fed85" }
bumble-att = { git = "https://github.com/chaitanyarahalkar/bumble-rs", rev = "bbac2a6803b8cab0920ab725a23aa408fc4fed85" }
bumble-hci = { git = "https://github.com/chaitanyarahalkar/bumble-rs", rev = "bbac2a6803b8cab0920ab725a23aa408fc4fed85" }
bumble-host = { git = "https://github.com/chaitanyarahalkar/bumble-rs", rev = "bbac2a6803b8cab0920ab725a23aa408fc4fed85" }
crossbeam-channel = "0.5"
sha2 = "0.10"
serde_json = "1"
